<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assistant IA — GéoPlan</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<style>
:root{--bg-primary:#f5f5f0;--bg-secondary:#ffffff;--bg-card:#ffffff;--border:#e0ddd5;--text-primary:#1a1a1a;--text-secondary:#4a4a4a;--text-muted:#8a8a80;--gph-primary:#1a1a1a;--gph-yellow:#f5c518;--gph-yellow-light:#fef9e7;--gph-dark:#111111;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Bricolage Grotesque",sans-serif;background:var(--bg-primary);color:var(--text-primary);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.ai-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg-secondary);user-select:none;}
.ai-header-title{display:flex;align-items:center;gap:10px;}
.ai-header-title h3{font-size:0.9rem;font-weight:800;color:var(--gph-dark);}
.ai-header-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#f5c518,#e8b206);display:flex;align-items:center;justify-content:center;font-size:14px;}
.ai-header-btns{display:flex;align-items:center;gap:2px;}
.ai-header-btns button{background:none;border:none;width:30px;height:30px;border-radius:6px;cursor:pointer;color:var(--text-muted);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.ai-header-btns button:hover{background:var(--bg-primary);color:var(--text-primary);}
.ai-quick-actions{padding:8px 24px 4px;display:flex;flex-wrap:wrap;gap:6px;}
.ai-quick-btn{padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:var(--bg-card);font-size:0.68rem;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:all 0.15s;font-family:inherit;}
.ai-quick-btn:hover{border-color:var(--gph-yellow);background:var(--gph-yellow-light);color:var(--gph-dark);}
.ai-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
.ai-msg{max-width:92%;padding:12px 16px;border-radius:14px;font-size:0.82rem;line-height:1.55;word-wrap:break-word;}
.ai-msg-user{white-space:pre-wrap;align-self:flex-end;background:var(--gph-dark);color:#fff;border-bottom-right-radius:4px;}
.ai-msg-ai{align-self:flex-start;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-bottom-left-radius:4px;}
.ai-msg-ai strong,.ai-msg-ai b{color:var(--gph-dark);}
.ai-msg-ai table{margin:8px 0;} .ai-msg-ai ul,.ai-msg-ai ol{margin:6px 0;padding-left:20px;} .ai-msg-ai h2,.ai-msg-ai h3,.ai-msg-ai h4{margin-top:10px;}
.ai-msg-system{align-self:center;background:var(--gph-yellow-light);color:var(--text-secondary);font-size:0.72rem;font-weight:600;border-radius:20px;padding:6px 16px;border:1px solid rgba(245,197,24,0.2);}
.ai-typing{align-self:flex-start;padding:12px 16px;font-size:0.8rem;color:var(--text-muted);font-style:italic;}
.ai-input-bar{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--bg-secondary);}
.ai-input-bar textarea{flex:1;resize:none;border:2px solid var(--border);border-radius:10px;padding:10px 14px;font-size:0.82rem;font-family:inherit;color:var(--text-primary);outline:none;min-height:42px;max-height:120px;transition:border-color 0.2s;}
.ai-input-bar textarea:focus{border-color:var(--gph-yellow);}
.ai-input-bar textarea::placeholder{color:var(--text-muted);}
.ai-send-btn{width:42px;height:42px;border:none;border-radius:10px;background:var(--gph-dark);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
.ai-send-btn:hover{background:var(--gph-yellow);color:var(--gph-dark);}
.ai-send-btn:disabled{opacity:0.4;cursor:not-allowed;}
.ai-action-block{margin:10px 0;border:2px solid var(--gph-yellow);border-radius:10px;overflow:hidden;background:var(--bg-card);}
.ai-action-header{padding:8px 12px;background:var(--gph-yellow-light);font-size:0.75rem;font-weight:800;color:var(--gph-dark);border-bottom:1px solid rgba(245,197,24,0.3);}
.ai-action-item{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--border);gap:8px;}
.ai-action-item.applied{background:#f0fdf4;}
.ai-action-item.rejected{background:#fef2f2;opacity:0.5;}
.ai-action-label{font-size:0.75rem;font-weight:500;color:var(--text-primary);flex:1;}
.ai-action-btns{display:flex;gap:4px;}
.ai-action-yes{padding:4px 12px;border:1px solid #16A34A;border-radius:6px;background:#f0fdf4;color:#16A34A;font-size:0.68rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s;white-space:nowrap;}
.ai-action-yes:hover{background:#16A34A;color:#fff;}
.ai-action-no{padding:4px 12px;border:1px solid #DC2626;border-radius:6px;background:#fef2f2;color:#DC2626;font-size:0.68rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s;white-space:nowrap;}
.ai-action-no:hover{background:#DC2626;color:#fff;}
.ai-action-result{font-size:0.65rem;font-weight:700;white-space:nowrap;}
.ai-action-apply-all-btn{display:block;width:100%;padding:8px;border:none;background:linear-gradient(135deg,var(--gph-primary),#333);color:var(--gph-yellow);font-size:0.75rem;font-weight:800;cursor:pointer;font-family:inherit;transition:all 0.15s;}
.ai-action-apply-all-btn:hover{background:var(--gph-yellow);color:var(--gph-dark);}
.ai-action-progress{padding:6px 12px;font-size:0.68rem;color:var(--text-muted);font-weight:600;text-align:center;border-top:1px solid var(--border);}
.detached-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--gph-yellow-light);border:1px solid var(--gph-yellow);border-radius:12px;font-size:0.6rem;font-weight:700;color:var(--gph-dark);margin-left:8px;}
</style>
</head>
<body>

<div class="ai-header">
  <div class="ai-header-title"><div class="ai-header-icon">🤖</div><h3>Assistant IA</h3><span class="detached-badge">⇱ Fenêtre détachée</span></div>
  <div class="ai-header-btns">
    <button onclick="doReset()" title="Nouvelle conversation"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
    <button onclick="doReattach()" title="Rattacher à GéoPlan"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>
  </div>
</div>

<div class="ai-quick-actions">
  <button class="ai-quick-btn" onclick="doQuick('optimise')">🗺️ Optimiser tournées</button>
  <button class="ai-quick-btn" onclick="doQuick('charge')">⚖️ Charge de travail</button>
  <button class="ai-quick-btn" onclick="doQuick('suggestion')">💡 Suggestions semaine</button>
  <button class="ai-quick-btn" onclick="doQuick('urgent')">🚨 Caser une urgence</button>
  <button class="ai-quick-btn" onclick="doQuick('planifier')">📅 Planifier semaine prochaine</button>
  <button class="ai-quick-btn" onclick="doQuick('planifierAvecRapports')">📅📝 Planifier + Rapports</button>
  <button class="ai-quick-btn" onclick="doQuick('conflits')">⚠️ Vérifier conflits</button>
  <button class="ai-quick-btn" onclick="doQuick('meteo')">🌦️ Impact météo</button>
  <button class="ai-quick-btn" onclick="doQuick('affecter')">👤 Affecter intervention</button>
</div>

<div class="ai-messages" id="aiMessages">
  <div class="ai-msg-system">Assistant IA propulsé par Claude — fenêtre détachée, connectée à GéoPlan</div>
</div>

<div class="ai-input-bar">
  <textarea id="aiInput" placeholder="Ex: Optimise les tournées de demain en regroupant par zone..." rows="1"></textarea>
  <button class="ai-send-btn" id="aiSendBtn" onclick="doSend()">➤</button>
  <div id="aiCostBar" style="width:100%;display:none;justify-content:center;align-items:center;gap:12px;font-size:0.65rem;color:var(--text-secondary);font-weight:600;padding:4px 6px;order:1;background:var(--bg-primary);border-radius:6px;margin-top:4px;">
    <span id="aiCostTokens" style="display:inline-flex;align-items:center;gap:3px;"></span>
    <span id="aiCostPrice" style="display:inline-flex;align-items:center;gap:3px;"></span>
    <span id="aiCostCarbon" style="display:inline-flex;align-items:center;gap:3px;"></span>
  </div>
</div>

<script>
var bc = new BroadcastChannel("geoplan-ai");
var sendBtn, inputEl, messagesEl;

window.addEventListener("load", function() {
  sendBtn = document.getElementById("aiSendBtn");
  inputEl = document.getElementById("aiInput");
  messagesEl = document.getElementById("aiMessages");
  inputEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); }
  });
  inputEl.addEventListener("input", function() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });
  inputEl.focus();
  bc.postMessage({type: "popup-ready"});
});

window.addEventListener("beforeunload", function() {
  bc.postMessage({type: "popup-closed"});
});

bc.onmessage = function(ev) {
  var d = ev.data;
  if (d.type === "ai-user-echo") { appendMsg("user", d.text); }
  else if (d.type === "ai-typing-start") { showTyping(); }
  else if (d.type === "ai-typing-end") { hideTyping(); }
  else if (d.type === "ai-stream-html") { streamHtml(d.html); }
  else if (d.type === "ai-error") { hideTyping(); appendMsg("ai", "⚠️ " + d.text); enableInput(); }
  else if (d.type === "ai-stream-done") { enableInput(); }
  else if (d.type === "ai-cost") { updateCostBar(d.input, d.output); }
  else if (d.type === "ai-reset") {
    messagesEl.innerHTML = '<div class="ai-msg-system">Assistant IA propulsé par Claude — fenêtre détachée, connectée à GéoPlan</div>';
    updateCostBar(0, 0);
    enableInput();
  }
  else if (d.type === "reattach") { window.close(); }
};

var _typingEl = null;
var _streamEl = null;

function showTyping() {
  hideTyping();
  _typingEl = document.createElement("div");
  _typingEl.className = "ai-typing";
  _typingEl.textContent = "Réflexion en cours...";
  messagesEl.appendChild(_typingEl);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  if (_typingEl) { _typingEl.remove(); _typingEl = null; }
}

function streamHtml(h) {
  if (!_streamEl) {
    _streamEl = document.createElement("div");
    _streamEl.className = "ai-msg ai-msg-ai";
    messagesEl.appendChild(_streamEl);
  }
  _streamEl.innerHTML = h;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendMsg(role, text) {
  var el = document.createElement("div");
  el.className = "ai-msg ai-msg-" + role;
  if (role === "ai") { el.innerHTML = text; } else { el.textContent = text; }
  messagesEl.appendChild(el);
  if (role === "user") el.scrollIntoView({behavior: "smooth", block: "start"});
}

function enableInput() {
  sendBtn.disabled = false;
  inputEl.focus();
  _streamEl = null;
}

function doSend() {
  var msg = inputEl.value.trim();
  if (!msg) return;
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBtn.disabled = true;
  bc.postMessage({type: "send-message", text: msg});
}

function doQuick(type) {
  bc.postMessage({type: "send-message", text: "__quick__:" + type});
  sendBtn.disabled = true;
}

function doReset() { bc.postMessage({type: "reset"}); }
function doReattach() { bc.postMessage({type: "popup-closed"}); window.close(); }

function doAcceptAction(action, blockId, idx) {
  var itemEl = document.getElementById(blockId + "-item-" + idx);
  if (!itemEl || itemEl.classList.contains("applied") || itemEl.classList.contains("rejected")) return;
  itemEl.classList.add("applied");
  var btns = itemEl.querySelector(".ai-action-btns");
  if (btns) btns.innerHTML = '<span class="ai-action-result" style="color:#16A34A;">✓ Accepté</span>';
  bc.postMessage({type: "accept-action", action: action});
  updateProgress(blockId);
}

function doRejectAction(blockId, idx) {
  var itemEl = document.getElementById(blockId + "-item-" + idx);
  if (!itemEl || itemEl.classList.contains("applied") || itemEl.classList.contains("rejected")) return;
  itemEl.classList.add("rejected");
  var btns = itemEl.querySelector(".ai-action-btns");
  if (btns) btns.innerHTML = '<span class="ai-action-result" style="color:#DC2626;">✗ Refusé</span>';
  updateProgress(blockId);
}

function doAcceptAll(actions, blockId) {
  actions.forEach(function(a, j) {
    var itemEl = document.getElementById(blockId + "-item-" + j);
    if (itemEl && !itemEl.classList.contains("applied") && !itemEl.classList.contains("rejected")) {
      itemEl.classList.add("applied");
      var btns = itemEl.querySelector(".ai-action-btns");
      if (btns) btns.innerHTML = '<span class="ai-action-result" style="color:#16A34A;">✓ Accepté</span>';
    }
  });
  bc.postMessage({type: "accept-all-actions", actions: actions});
  updateProgress(blockId);
}

function updateProgress(blockId) {
  var items = document.querySelectorAll("[id^='" + blockId + "-item-']");
  var done = 0;
  items.forEach(function(el) { if (el.classList.contains("applied") || el.classList.contains("rejected")) done++; });
  var prog = document.getElementById(blockId + "-progress");
  if (prog) prog.textContent = done + " / " + items.length + " traitée(s)";
}

function updateCostBar(inp, out) {
  var bar = document.getElementById("aiCostBar");
  if (!bar) return;
  if (!inp && !out) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  document.getElementById("aiCostTokens").textContent = "🔤 " + (inp/1000).toFixed(1) + "k in · " + (out/1000).toFixed(1) + "k out";
  var costEur = (inp * 3.0 + out * 15.0) / 1e6 * 0.92;
  document.getElementById("aiCostPrice").textContent = "💰 ~" + costEur.toFixed(4) + " €";
  var totalTokens = inp + out;
  var co2mg = totalTokens * 0.004;
  var co2Label = co2mg >= 1000 ? (co2mg / 1000).toFixed(2) + " g" : co2mg.toFixed(1) + " mg";
  document.getElementById("aiCostCarbon").textContent = "🌱 ~" + co2Label + " CO₂";
}
</script>
</body>
</html>
